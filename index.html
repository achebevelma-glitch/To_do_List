<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>To-Do List</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="app">
    <header class="app-header">
      <h1>My To-Do List</h1>
      <button id="themeToggle" class="icon-btn" title="Toggle dark/light mode" aria-label="Toggle theme">🌙</button>
    </header>

    <form id="taskForm" class="task-form">
      <input
        type="text"
        id="taskInput"
        placeholder="What do you need to do?"
        maxlength="120"
        autocomplete="off"
      />
      <select id="prioritySelect" title="Priority">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
      <input type="date" id="dueDateInput" title="Due date" />
      <button type="submit" class="add-btn">Add Task</button>
    </form>
    <div class="char-counter"><span id="charCount">0</span>/120</div>

    <div class="controls">
      <div class="filters" id="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>
      <input type="text" id="searchInput" class="search-input" placeholder="Search tasks..." />
    </div>

    <ul id="taskList" class="task-list"></ul>

    <p id="emptyState" class="empty-state">No tasks yet. Add one above to get started!</p>

    <footer class="app-footer">
      <span id="taskCounter">0 tasks remaining</span>
      <div class="footer-buttons">
        <button id="clearCompletedBtn" class="text-btn">Clear Completed</button>
        <button id="deleteAllBtn" class="text-btn danger">Delete All</button>
      </div>
    </footer>
  </div>

  <div id="confirmModal" class="modal hidden">
    <div class="modal-content">
      <p id="confirmMessage">Are you sure?</p>
      <div class="modal-actions">
        <button id="confirmYes" class="danger-btn">Yes, delete</button>
        <button id="confirmNo" class="text-btn">Cancel</button>
      </div>
    </div>
  </div>

  <script src="/js/script.js"></script>
</body>
</html>
